version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: makaut_campussense_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: campussense
      POSTGRES_USER: campussense_user
      POSTGRES_PASSWORD: campussense_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campussense_user -d campussense"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
