server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

spring:
  application:
    name: makaut-campussense
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    default: dev
  main:
    headless: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campussense}
    username: ${DB_USER:campussense_user}
    password: ${DB_PASSWORD:campussense_password}

clerk:
  publishable-key: ${CLERK_PUBLISHABLE_KEY:pk_test_Zmx5aW5nLWxpb25lc3MtNDcxNy5jbGVyay5hY2NvdW50cy5kZXYk}
  secret-key: ${CLERK_SECRET_KEY:sk_test_pJ1VAe96OhB6iomGiQ4CLjefswTH7koQpTyER9UaFn}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
  groq:
    api-key: ${GROQ_API_KEY:}

campussense:
  vector:
    dimensions: 1536
    similarity-threshold: 0.35
    top-k: 5
    chunk-size-tokens: 500
    chunk-overlap-tokens: 50
  llm:
    provider: ${LLM_PROVIDER:mock} # mock | openai | gemini
    api-key: ${OPENAI_API_KEY:}
    gemini-api-key: ${ai.gemini.api-key:${GEMINI_API_KEY:}}
    groq-api-key: ${ai.groq.api-key:${GROQ_API_KEY:}}
    model: ${LLM_MODEL:gpt-4o-mini}
    temperature: 0.2
    max-tokens: 1000
  embedding:
    provider: ${EMBEDDING_PROVIDER:mock} # mock | openai | deterministic
    api-key: ${OPENAI_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
