<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — MAKAUT CampusSense</title>

  <!-- Performance Acceleration: Preconnect & Prefetch -->
  <link rel="preconnect" href="https://flying-lioness-4717.clerk.accounts.dev" crossorigin>
  <link rel="dns-prefetch" href="https://flying-lioness-4717.clerk.accounts.dev">

  <!-- Official Clerk JS Distribution Script -->
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_Zmx5aW5nLWxpb25lc3MtNDcxNy5jbGVyay5hY2NvdW50cy5kZXYk" src="https://flying-lioness-4717.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Stable Viewport to Eliminate Jitter & Recalculation Thrashing */
    html, body {
      min-height: 100vh !important;
      height: auto !important;
      overflow-y: scroll !important;
      overflow-x: hidden !important;
      scrollbar-gutter: stable !important;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
    }

    /* Top Return Link: ONLY element above the card */
    .back-link {
      display: inline-block !important;
      position: relative !important;
      z-index: 999 !important;
      pointer-events: auto !important;
      text-decoration: none !important;
      cursor: pointer !important;
      width: 100%;
      max-width: 440px;
      margin-bottom: 1.5rem;
      color: #94a3b8;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: #ffffff;
    }

    /* Single-Card Mount Target: Zero Double Borders */
    #clerk-mount {
      min-height: 520px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 auto !important;
    }

    /* Instant CSS Loading Skeleton Inside #clerk-mount (Eliminates 7-Second Void) */
    .auth-skeleton-card {
      width: 100%;
      max-width: 440px;
      min-height: 500px;
      background-color: #16181f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.75rem;
      padding: 2rem 1.75rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .skeleton-shimmer {
      background: linear-gradient(90deg, #1e222d 25%, #2a3142 50%, #1e222d 75%);
      background-size: 200% 100%;
      animation: shimmer-load 1.6s infinite;
      border-radius: 0.5rem;
    }

    @keyframes shimmer-load {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-social-btn {
      height: 42px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .skeleton-divider-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.25rem 0;
    }

    .skeleton-divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .skeleton-divider-text {
      color: #64748b;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .skeleton-title {
      height: 28px;
      width: 58%;
    }

    .skeleton-subtitle {
      height: 16px;
      width: 82%;
      margin-top: -0.4rem;
    }

    .skeleton-label {
      height: 14px;
      width: 32%;
      margin-top: 0.4rem;
    }

    .skeleton-input {
      height: 42px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .skeleton-btn-primary {
      height: 42px;
      width: 100%;
      background: #ffffff !important;
      opacity: 0.95;
      margin-top: 0.4rem;
      border-radius: 0.5rem;
    }

    .skeleton-footer {
      height: 16px;
      width: 48%;
      margin: 1rem auto 0;
    }

    .cl-rootBox,
    .cl-cardBox {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 auto !important;
    }

    /* StockPulse 1:1 Theme - Card Styling */
    .cl-card {
      background-color: #16181f !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 0.75rem !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
      color: #ffffff !important;
    }

    /* Section 5: Card Header, Subtitles & Labels */
    .cl-headerTitle, [class*="headerTitle"] {
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 1.35rem !important;
    }

    .cl-headerSubtitle, [class*="headerSubtitle"] {
      color: #cbd5e1 !important;
      opacity: 1 !important;
    }

    .cl-formFieldLabel, [class*="formFieldLabel"] {
      color: #e2e8f0 !important;
      font-weight: 600 !important;
    }

    /* Section 5: Form Controls & Buttons */
    .cl-formFieldInput, [class*="formFieldInput"] {
      background-color: #1e222d !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: #ffffff !important;
      border-radius: 0.5rem !important;
    }

    .cl-formFieldInput:focus, [class*="formFieldInput"]:focus {
      border-color: rgba(255, 255, 255, 0.4) !important;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1) !important;
    }

    .cl-formButtonPrimary, [class*="formButtonPrimary"] {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 700 !important;
      border: none !important;
      border-radius: 0.5rem !important;
      box-shadow: none !important;
    }

    .cl-formButtonPrimary:hover, [class*="formButtonPrimary"]:hover {
      background-color: #e2e8f0 !important;
      color: #000000 !important;
    }

    .cl-socialButtonsBlockButton, [class*="socialButtonsBlockButton"] {
      background-color: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      color: #ffffff !important;
      border-radius: 0.5rem !important;
    }

    .cl-socialButtonsBlockButton:hover, [class*="socialButtonsBlockButton"]:hover {
      background-color: rgba(255, 255, 255, 0.08) !important;
    }

    /* OTP Screen: Remove Outer Box, Style 6 Digit Boxes */
    .cl-otpCodeFieldInputs,
    .cl-otpCodeField,
    [class*="otpCodeFieldInputs"],
    [class*="otpCodeFieldInputs"] fieldset,
    [class*="otpCodeField"] fieldset,
    .cl-formField-otpCode fieldset,
    fieldset:has([class*="otpCodeFieldInput"]) {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      outline: none !important;
      padding: 0 !important;
      margin: 0 auto !important;
    }

    .cl-otpCodeFieldInput,
    [class*="otpCodeFieldInput"] {
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      background-color: #1e222d !important;
      color: #ffffff !important;
      border-radius: 0.5rem !important;
      box-shadow: none !important;
      font-weight: 700 !important;
    }

    .cl-otpCodeFieldInput:focus,
    [class*="otpCodeFieldInput"]:focus {
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25) !important;
    }

    /* Hide "Use another method" Link via CSS */
    [class*="alternativeMethods"],
    [data-localization-key*="useAnotherMethod"],
    [data-localization-key*="alternativeMethods"],
    .cl-alternativeMethodsBlockButton,
    [class*="alternativeMethodsBlockButton"],
    button[data-localization-key*="useAnotherMethod"],
    a[data-localization-key*="useAnotherMethod"] {
      display: none !important;
    }

    /* Section 5: Footer & Clerk Branding Visibility */
    .cl-footer,
    .cl-footerAction,
    [class*="cl-footer"] {
      background-color: #16181f !important;
      border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    [class*="cl-footerText"],
    [class*="cl-footerActionText"],
    [class*="cl-securedByText"],
    [class*="cl-securedBy"] {
      color: #94a3b8 !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    [class*="cl-footer"] svg,
    [class*="cl-footer"] img,
    .cl-internal-logo,
    [class*="cl-securedBy"] svg,
    [class*="cl-securedBy"] img {
      filter: brightness(0) invert(1) !important;
      opacity: 0.9 !important;
    }
  </style>
</head>
<body>

  <!-- Only Two Elements Outside the Card: Return Link and Mount Target -->
  <a href="/" class="back-link" style="pointer-events: auto !important; position: relative !important; z-index: 999 !important; text-decoration: none !important; display: inline-block !important;">← Back to CampusSense</a>
  <div id="clerk-mount">
    <div class="auth-skeleton-card" id="clerk-skeleton">
      <div class="skeleton-shimmer skeleton-social-btn"></div>
      <div class="skeleton-divider-row">
        <span class="skeleton-divider-line"></span>
        <span class="skeleton-divider-text">or</span>
        <span class="skeleton-divider-line"></span>
      </div>
      <div class="skeleton-shimmer skeleton-title"></div>
      <div class="skeleton-shimmer skeleton-subtitle"></div>
      <div class="skeleton-shimmer skeleton-label"></div>
      <div class="skeleton-shimmer skeleton-input"></div>
      <div class="skeleton-btn-primary"></div>
      <div class="skeleton-shimmer skeleton-footer"></div>
    </div>
  </div>

  <script>
    async function initStockPulseAuth() {
      const mountPoint = document.getElementById('clerk-mount');
      if (!mountPoint) return;
      if (mountPoint.dataset.mounted === 'true') return;

      const publishableKey = 'pk_test_Zmx5aW5nLWxpb25lc3MtNDcxNy5jbGVyay5hY2NvdW50cy5kZXYk';

      // Poll non-blockingly until window.Clerk is present (up to 12 seconds)
      let attempts = 0;
      while (!window.Clerk && attempts < 400) {
        await new Promise(r => setTimeout(r, 30));
        attempts++;
      }

      if (!window.Clerk) {
        console.error("Clerk SDK failed to load");
        mountPoint.innerHTML = '<div style="color: #94a3b8; text-align: center; padding: 2rem;">Authentication is loading. Please refresh if card does not appear.</div>';
        return;
      }

      // Ensure Clerk.load() is called strictly once
      if (!window.Clerk.loaded && typeof window.Clerk.load === 'function') {
        await window.Clerk.load({ publishableKey });
      }

      // If user is already authenticated, redirect cleanly to '/'
      if (window.Clerk.user) {
        window.location.replace('/');
        return;
      }

      // Mount Idempotency & Lifecycle Guard: strictly once
      if (mountPoint && !mountPoint.dataset.mounted) {
        mountPoint.dataset.mounted = 'true';
        mountPoint.innerHTML = '';
        window.Clerk.mountSignIn(mountPoint, {
          fallbackRedirectUrl: '/',
          signUpFallbackRedirectUrl: '/',
          appearance: {
            variables: {
              colorPrimary: '#ffffff',
              colorTextOnPrimaryBackground: '#000000',
              colorBackground: '#16181f',
              colorInputBackground: '#1e222d',
              colorInputText: '#ffffff',
              colorText: '#ffffff',
              colorTextSecondary: '#cbd5e1',
              borderRadius: '0.75rem'
            },
            layout: {
              socialButtonsVariant: 'blockButton',
              socialButtonsPlacement: 'top'
            },
            elements: {
              rootBox: { background: 'transparent', border: 'none', boxShadow: 'none', padding: '0', margin: '0 auto' },
              cardBox: { background: 'transparent', border: 'none', boxShadow: 'none', padding: '0', margin: '0 auto' },
              card: {
                backgroundColor: '#16181f',
                border: '1px solid rgba(255, 255, 255, 0.08)',
                borderRadius: '0.75rem',
                boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.6)'
              },
              headerTitle: { color: '#ffffff', fontWeight: '700' },
              headerSubtitle: { color: '#cbd5e1' },
              formHeaderSubtitle: { color: '#cbd5e1' },
              dividerLine: { backgroundColor: 'rgba(255, 255, 255, 0.08)' },
              dividerText: { color: '#94a3b8' },
              formFieldLabel: { color: '#e2e8f0', fontWeight: '600' },
              formFieldInput: {
                backgroundColor: '#1e222d',
                color: '#ffffff',
                border: '1px solid rgba(255, 255, 255, 0.2)',
                borderRadius: '0.5rem'
              },
              otpCodeFieldInputs: {
                border: 'none',
                background: 'transparent',
                boxShadow: 'none',
                padding: '0',
                margin: '0 auto'
              },
              otpCodeField: {
                border: 'none',
                background: 'transparent',
                boxShadow: 'none'
              },
              otpCodeFieldInput: {
                backgroundColor: '#1e222d',
                color: '#ffffff',
                border: '1px solid rgba(255, 255, 255, 0.25)',
                borderRadius: '0.5rem',
                fontWeight: '700'
              },
              alternativeMethods: { display: 'none' },
              alternativeMethodsBlockButton: { display: 'none' },
              socialButtonsBlockButton: {
                backgroundColor: 'rgba(255, 255, 255, 0.05)',
                border: '1px solid rgba(255, 255, 255, 0.15)',
                color: '#ffffff'
              },
              socialButtonsBlockButtonText: { color: '#ffffff', fontWeight: '600' },
              formButtonPrimary: {
                backgroundColor: '#ffffff',
                color: '#000000',
                fontWeight: '700',
                borderRadius: '0.5rem'
              },
              footer: {
                backgroundColor: '#16181f',
                borderTop: '1px solid rgba(255, 255, 255, 0.08)'
              },
              footerAction: { backgroundColor: '#16181f' },
              footerActionText: { color: '#94a3b8' },
              footerActionLink: { color: '#ffffff', fontWeight: '600' },
              footerText: { color: '#94a3b8' },
              identityPreviewText: { color: '#cbd5e1' },
              identityPreviewEditButton: { color: '#cbd5e1' },
              logoImage: { filter: 'brightness(0) invert(1) !important', opacity: '0.9' }
            }
          }
        });
      }
    }

    const clerkScript = document.querySelector('script[data-clerk-publishable-key]');
    if (window.Clerk) {
      initStockPulseAuth();
    } else if (clerkScript) {
      clerkScript.addEventListener('load', initStockPulseAuth);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initStockPulseAuth);
    } else {
      initStockPulseAuth();
    }
  </script>
</body>
</html>
