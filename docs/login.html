<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — MAKAUT CampusSense</title>

  <!-- Load existing workspace Clerk scripts dynamically -->
  <script defer crossorigin="anonymous" src="https://flying-lioness-4717.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"></script>
  <script defer crossorigin="anonymous" data-clerk-publishable-key="pk_test_Zmx5aW5nLWxpb25lc3MtNDcxNy5jbGVyay5hY2NvdW50cy5kZXYk" src="https://flying-lioness-4717.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }

    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      transition: color 0.2s ease;
    }
    .back-btn:hover { color: #ffffff; }

    /* ONLY "Sign In" title above the card */
    .page-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-align: center;
      letter-spacing: -0.02em;
    }

    /* Outer mount container: Zero border, zero background to prevent double boxes */
    #clerk-sign-in {
      display: flex;
      justify-content: center;
      width: 100%;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    /* Strip outer Clerk wrapper borders */
    .cl-rootBox,
    .cl-cardBox {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* The ONE and ONLY card container */
    .cl-card {
      background-color: #16181f !important;
      background: #16181f !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 0.75rem !important;
      box-shadow: none !important;
    }

    /* Seamless footer matching card */
    .cl-footer,
    .cl-footerAction,
    [class*="cl-footer"] {
      background-color: #16181f !important;
      background: #16181f !important;
      border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
      box-shadow: none !important;
    }

    /* High contrast primary button (Solid white, bold black text) */
    [class*="cl-formButtonPrimary"] {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 700 !important;
      border-radius: 0.5rem !important;
    }
    [class*="cl-formButtonPrimary"] * {
      color: #000000 !important;
      font-weight: 700 !important;
    }

    /* Ensure Clerk logo and branding are visible against dark theme */
    [class*="cl-footer"] svg,
    [class*="cl-footer"] img,
    .cl-internal-logo,
    [class*="cl-securedBy"] svg,
    [class*="cl-securedBy"] img {
      filter: brightness(0) invert(1) !important;
      opacity: 0.85 !important;
    }

    [class*="cl-footerText"],
    [class*="cl-footerActionText"],
    [class*="cl-securedBy"] {
      color: #94a3b8 !important;
    }
    [class*="cl-footerActionLink"] {
      color: #ffffff !important;
      font-weight: 600 !important;
    }
  </style>
</head>
<body>

  <a href="/" class="back-btn">← Back to CampusSense</a>
  <h1 class="page-title">Sign In</h1>

  <!-- Single mount target -->
  <div id="clerk-sign-in"></div>

  <script>
    window.addEventListener('load', async () => {
      await window.Clerk.load();

      if (window.Clerk.user) {
        window.location.replace('/');
        return;
      }

      const container = document.getElementById('clerk-sign-in');
      if (container && !container.hasChildNodes()) {
        window.Clerk.mountSignIn(container, {
          fallbackRedirectUrl: '/',
          signUpFallbackRedirectUrl: '/',
          appearance: {
            variables: {
              colorPrimary: '#ffffff',
              colorTextOnPrimaryBackground: '#000000',
              colorBackground: '#16181f',
              colorInputBackground: '#1e212b',
              colorInputText: '#ffffff',
              colorText: '#ffffff',
              colorTextSecondary: '#94a3b8',
              borderRadius: '0.75rem'
            },
            layout: {
              socialButtonsVariant: 'blockButton',
              socialButtonsPlacement: 'top'
            }
          }
        });
      }
    });

    window.addEventListener('pageshow', (e) => {
      if (e.persisted && window.Clerk && window.Clerk.user) {
        window.location.replace('/');
      }
    });
  </script>
</body>
</html>
