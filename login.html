<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — MAKAUT CampusSense</title>

  <!-- Dynamic Clerk SDK scripts loaded from workspace configuration -->
  <script defer crossorigin="anonymous" src="https://flying-lioness-4717.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"></script>
  <script defer crossorigin="anonymous" data-clerk-publishable-key="pk_test_Zmx5aW5nLWxpb25lc3MtNDcxNy5jbGVyay5hY2NvdW50cy5kZXYk" src="https://flying-lioness-4717.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }

    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.875rem;
      margin-bottom: 1.75rem;
      transition: color 0.2s ease;
    }
    .back-link:hover {
      color: #ffffff;
    }

    /* Mount container: transparent with zero borders to eliminate nested boxes */
    #clerk-mount {
      display: flex;
      justify-content: center;
      width: 100%;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    /* Remove outer wrapper borders and boxes from Clerk */
    .cl-rootBox,
    .cl-cardBox {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* The single card styling matching StockPulse */
    .cl-card {
      background-color: #16181f !important;
      background: #16181f !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 0.75rem !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
    }

    /* Seamless footer with zero white box leakage */
    .cl-footer,
    .cl-footerAction,
    [class*="cl-footer"] {
      background-color: #16181f !important;
      background: #16181f !important;
      border-top: 1px solid rgba(255, 255, 255, 0.06) !important;
      box-shadow: none !important;
    }

    /* Primary Continue button: solid white with bold black text */
    [class*="cl-formButtonPrimary"] {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 700 !important;
      border-radius: 0.5rem !important;
    }
    [class*="cl-formButtonPrimary"] * {
      color: #000000 !important;
      font-weight: 700 !important;
    }

    /* Make Clerk logo and footer text clearly visible in dark mode */
    [class*="cl-footer"] svg,
    [class*="cl-footer"] img,
    .cl-internal-logo,
    [class*="cl-securedBy"] svg,
    [class*="cl-securedBy"] img {
      filter: brightness(0) invert(1) !important;
      opacity: 0.9 !important;
    }

    [class*="cl-footerText"],
    [class*="cl-footerActionText"],
    [class*="cl-securedBy"] {
      color: #94a3b8 !important;
    }
    [class*="cl-footerActionLink"] {
      color: #ffffff !important;
      font-weight: 600 !important;
    }
  </style>
</head>
<body>

  <a href="/" class="back-link">← Back to CampusSense</a>

  <!-- Single Clerk mount container -->
  <div id="clerk-mount"></div>

  <script>
    window.addEventListener('load', async () => {
      await window.Clerk.load();

      if (window.Clerk.user) {
        window.location.replace('/');
        return;
      }

      const container = document.getElementById('clerk-mount');
      if (container && !container.hasChildNodes()) {
        window.Clerk.mountSignIn(container, {
          fallbackRedirectUrl: '/',
          signUpFallbackRedirectUrl: '/',
          appearance: {
            variables: {
              colorPrimary: '#ffffff',
              colorTextOnPrimaryBackground: '#000000',
              colorBackground: '#16181f',
              colorInputBackground: '#1e212b',
              colorInputText: '#ffffff',
              colorText: '#ffffff',
              colorTextSecondary: '#94a3b8',
              borderRadius: '0.75rem'
            },
            layout: {
              socialButtonsVariant: 'blockButton',
              socialButtonsPlacement: 'top'
            }
          }
        });
      }
    });

    window.addEventListener('pageshow', (e) => {
      if (e.persisted && window.Clerk && window.Clerk.user) {
        window.location.replace('/');
      }
    });
  </script>
</body>
</html>
