<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — MAKAUT CampusSense</title>

  <!-- Dynamically detect and include existing workspace Clerk scripts -->
  <script defer crossorigin="anonymous" src="https://flying-lioness-4717.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"></script>
  <script defer crossorigin="anonymous" data-clerk-publishable-key="pk_test_Zmx5aW5nLWxpb25lc3MtNDcxNy5jbGVyay5hY2NvdW50cy5kZXYk" src="https://flying-lioness-4717.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }
    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #ffffff; }
    .page-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      text-align: center;
    }
    .page-desc {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    #clerk-sign-in {
      display: flex;
      justify-content: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <a href="/" class="back-btn">← Back to CampusSense</a>
  <h1 class="page-title">Sign in to MAKAUT CampusSense</h1>
  <p class="page-desc">Access syllabus blueprints, semester PYQs, and panic packs.</p>

  <!-- Official Clerk component mounts here -->
  <div id="clerk-sign-in"></div>

  <script>
    window.addEventListener('load', async () => {
      await window.Clerk.load();

      if (window.Clerk.user) {
        window.location.replace('/');
        return;
      }

      const container = document.getElementById('clerk-sign-in');
      if (container && !container.hasChildNodes()) {
        window.Clerk.mountSignIn(container, {
          fallbackRedirectUrl: '/',
          signUpFallbackRedirectUrl: '/',
          appearance: {
            variables: {
              colorPrimary: '#ffffff',
              colorBackground: '#111318',
              colorText: '#ffffff',
              colorInputBackground: '#1a1d24',
              colorInputText: '#ffffff',
              colorTextSecondary: '#94a3b8',
              borderRadius: '0.75rem'
            },
            layout: {
              socialButtonsVariant: 'blockButton',
              socialButtonsPlacement: 'top'
            }
          }
        });
      }
    });

    window.addEventListener('pageshow', (e) => {
      if (e.persisted && window.Clerk && window.Clerk.user) {
        window.location.replace('/');
      }
    });
  </script>
</body>
</html>
